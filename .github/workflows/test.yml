name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  build-image:
    name: Test build-image.sh
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests
        run: ./tests/test-build-image.sh
