name: Build docker images

on:
  workflow_run:
    workflows: ["Repo Sync"]
    types:
      - completed
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git commit or ref to build from (default: `main`)"
        type: string
        default: ''
      tag:
        description: Tag to push (default "develop")
        type: string
        default: develop
      images:
        description: JSON array of image names to build instead of all of them
        type: string
        default: ''

permissions: {}

jobs:
  select:
    permissions:
      contents: read
    uses: ./.github/workflows/image-list.yml
    with:
      ref: ${{ inputs.ref }}
      images: ${{ inputs.images }}

  build-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: select
    if: needs.select.outputs.containers != '[]'
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJSON(needs.select.outputs.containers) }}
    steps:
      - name: Check out the repo
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docker image and push to ghcr.io
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.container.context }}
          file: ${{ matrix.container.file }}
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          labels: org.opencontainers.image.revision=${{ steps.checkout.outputs.commit }}
          tags: ghcr.io/nextcloud-releases/${{ matrix.container.name }}:${{ inputs.tag || 'develop' }}

  build-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    needs: select
    if: needs.select.outputs.containers != '[]'
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJSON(needs.select.outputs.containers) }}
    steps:
      - name: Check out the repo
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docker image and push to ghcr.io
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.container.context }}
          file: ${{ matrix.container.file }}
          platforms: linux/arm64
          pull: true
          no-cache: true
          push: true
          labels: org.opencontainers.image.revision=${{ steps.checkout.outputs.commit }}
          tags: ghcr.io/nextcloud-releases/${{ matrix.container.name }}:${{ inputs.tag || 'develop' }}-arm64
