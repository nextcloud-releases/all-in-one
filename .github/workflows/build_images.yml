name: Build docker images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit of nextcloud/all-in-one to build'
        default: 'main'
        required: true
        type: string

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      names: ${{ steps.resolve.outputs.names }}
    steps:
      - name: Check out this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out nextcloud/all-in-one
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/all-in-one
          ref: ${{ inputs.ref }}
          path: all-in-one
          persist-credentials: false

      # All build jobs use the same commit and image list, even if the ref moves on while they run
      - name: Resolve the commit and the images to build
        id: resolve
        env:
          REF: ${{ inputs.ref }}
        run: |
          SHA="$(git -C ./all-in-one rev-parse HEAD)"
          NAMES="$(./build-image.sh --list ./all-in-one | jq --raw-input --slurp --compact-output 'split("\n") | map(select(length > 0))')"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "names=$NAMES" >> "$GITHUB_OUTPUT"
          echo "Building nextcloud/all-in-one@$SHA (ref: \`$REF\`)." >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: resolve
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [
          {runner: 'ubuntu-latest', platform: 'linux/amd64', tag: 'develop'},
          {runner: 'ubuntu-24.04-arm', platform: 'linux/arm64', tag: 'develop-arm64'}
        ]
        name: ${{ fromJSON(needs.resolve.outputs.names) }}
    steps:
      - name: Check out this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out nextcloud/all-in-one
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/all-in-one
          ref: ${{ needs.resolve.outputs.sha }}
          path: all-in-one
          persist-credentials: false
      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docker image and push to ghcr.io
        env:
          NAME: ${{ matrix.name }}
          TAG: ${{ matrix.arch.tag }}
          PLATFORM: ${{ matrix.arch.platform }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          ./build-image.sh ./all-in-one "$NAME" "$TAG" --platform "$PLATFORM" --no-cache --push \
            --label "org.opencontainers.image.revision=$SHA"
