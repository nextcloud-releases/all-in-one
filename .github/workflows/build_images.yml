name: Build docker images

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch of nextcloud/all-in-one to build: main (pushed to develop and promoted via beta), or release-<major>.<minor> like release-14.4 (pushed to latest-candidate, to test and then promote directly to latest)'
        default: 'main'
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        description: Commit of nextcloud/all-in-one to build instead of the main branch
        type: string
        default: ''
      tag:
        description: Tag to push instead of develop
        type: string
        default: develop
      images:
        description: JSON array of image names to build instead of all of them
        type: string
        default: ''

permissions: {}

concurrency:
  group: images-${{ inputs.tag || (inputs.branch == 'main' && 'develop' || 'latest-candidate') }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      names: ${{ steps.resolve.outputs.names }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Choose the tag for the branch
        id: tag
        env:
          BRANCH: ${{ inputs.branch }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$BRANCH" = "main" ]; then
            echo "tag=develop" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$BRANCH" =~ ^release-[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Only main and release-<major>.<minor> branches (e.g. release-14.4) can be built, not $BRANCH."
            exit 1
          fi
          # Checked here, because the checkout's error doesn't say which release branches exist
          RELEASE_BRANCHES="$(git ls-remote --heads https://github.com/nextcloud/all-in-one.git | sed 's|.*refs/heads/||' | grep -E '^release-[0-9]+\.[0-9]+$' | sort -V | paste -sd ' ' - || true)"
          if [[ " $RELEASE_BRANCHES " != *" $BRANCH "* ]]; then
            echo "::error::nextcloud/all-in-one has no branch $BRANCH. Its release branches are: ${RELEASE_BRANCHES:-none}"
            exit 1
          fi
          echo "tag=latest-candidate" >> "$GITHUB_OUTPUT"
      - name: Check out this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out nextcloud/all-in-one
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/all-in-one
          ref: ${{ inputs.ref || format('refs/heads/{0}', inputs.branch || 'main') }}
          path: all-in-one
          persist-credentials: false

      # All build jobs use the same commit and image list, even if the branch moves on while they run
      - name: Resolve the commit and the images to build
        id: resolve
        env:
          BRANCH: ${{ inputs.branch || 'main' }}
          REF: ${{ inputs.ref }}
          TAG: ${{ steps.tag.outputs.tag }}
          IMAGES: ${{ inputs.images }}
        run: |
          SHA="$(git -C ./all-in-one rev-parse HEAD)"
          NAMES="$(./build-image.sh --list ./all-in-one | jq --raw-input --slurp --compact-output 'split("\n") | map(select(length > 0))')"
          if [ -n "$IMAGES" ]; then
            UNKNOWN="$(jq --null-input --raw-output --argjson all "$NAMES" --argjson wanted "$IMAGES" '$wanted - $all | join(" ")')"
            if [ -n "$UNKNOWN" ]; then
              echo "::error::nextcloud/all-in-one@$SHA has no images named: $UNKNOWN"
              exit 1
            fi
            NAMES="$(jq --null-input --compact-output --argjson all "$NAMES" --argjson wanted "$IMAGES" '$all - ($all - $wanted)')"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "names=$NAMES" >> "$GITHUB_OUTPUT"
          if [ -n "$REF" ]; then
            ORIGIN="ref: \`$REF\`"
          else
            ORIGIN="branch: \`$BRANCH\`"
          fi
          echo "Building nextcloud/all-in-one@$SHA ($ORIGIN) as \`$TAG\` and \`$TAG-arm64\`." >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: resolve
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [
          {runner: 'ubuntu-latest', platform: 'linux/amd64', suffix: ''},
          {runner: 'ubuntu-24.04-arm', platform: 'linux/arm64', suffix: '-arm64'}
        ]
        name: ${{ fromJSON(needs.resolve.outputs.names) }}
    steps:
      - name: Check out this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out nextcloud/all-in-one
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/all-in-one
          ref: ${{ needs.resolve.outputs.sha }}
          path: all-in-one
          persist-credentials: false
      - name: Login to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docker image and push to ghcr.io
        env:
          NAME: ${{ matrix.name }}
          TAG: ${{ needs.resolve.outputs.tag }}${{ matrix.arch.suffix }}
          PLATFORM: ${{ matrix.arch.platform }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          ./build-image.sh ./all-in-one "$NAME" "$TAG" --platform "$PLATFORM" --pull --no-cache --push \
            --label "org.opencontainers.image.revision=$SHA"
